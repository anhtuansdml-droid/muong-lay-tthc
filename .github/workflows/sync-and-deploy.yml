name: Dong bo va xuat ban Mường Lay TTHC

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: muong-lay-tthc
  cancel-in-progress: false

jobs:
  sync:
    name: Dong bo du lieu TTHC
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dong bo TTHC Dien Bien
        run: |
          python scripts/sync.py

      - name: Kiem tra du lieu
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/tthc.json")

          if not p.exists():
              raise SystemExit("KHONG CO data/tthc.json")

          data = json.loads(p.read_text(encoding="utf-8"))

          if not isinstance(data, list):
              raise SystemExit("data/tthc.json khong phai danh sach")

          if len(data) == 0:
              raise SystemExit("DU LIEU TTHC = 0 - KHONG DEPLOY")

          print(f"SYNC OK: {len(data)} TTHC")
          PY

      - name: Luu du lieu vao repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/tthc.json data/meta.json || true

          if git diff --cached --quiet; then
            echo "Khong co thay doi du lieu."
          else
            git commit -m "Auto update TTHC Dien Bien"
            git push
          fi

  deploy:
    name: Xuat ban website
    needs: sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cau hinh Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
